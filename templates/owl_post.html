<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Post - Wizardry Web</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Harry Potter style magical font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <!-- Magical Navbar -->
<nav class="wizard-navbar">
    <div class="logo" style="color: #ffd700; font-family: 'Cinzel Decorative', cursive, serif; text-shadow: 0 0 8px #ffd700;">🧹Wizardry Web</div>
    <ul class="nav-links">
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('houses') }}">Houses</a></li>
        <li><a href="{{ url_for('spells') }}">Spells</a></li>
        <li><a href="{{ url_for('owl_post') }}">Owl Post</a></li>
        <li><a href="{{ url_for('owl_archive') }}">Owl Archive</a></li>
    </ul>
</nav>

    <!-- Owl Post Content Box -->
    <div class="owl-post-container">
        <h2><i class="fa-solid fa-dove"></i> Send an Owl Post</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('owl_post') }}" method="POST">
            <div class="form-group">
                <label for="wizard_name">Your Witch/Wizard Name:</label>
                <input type="text" id="wizard_name" name="wizard_name" required placeholder="e.g., Hermione Granger">
            </div>

            <div class="form-group">
                <label for="receiver">Receiver:</label>
                <input type="text" id="receiver" name="receiver" required placeholder="e.g., Albus Dumbledore">
            </div>

            <div class="form-group">
                <label for="message">Message for the Owl:</label>
                <textarea id="message" name="message" rows="5" required placeholder="Write your message across the magical realm..."></textarea>
            </div>

            <button type="submit" class="magical-btn">Dispatch Owl <i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>
</body>
</html>
