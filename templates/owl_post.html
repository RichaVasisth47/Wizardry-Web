<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Post - Wizardry Web</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="magical-sparkles"></div>
    <nav class="wizard-navbar">
        <div class="logo" style="color: #ffd700; font-family: 'Cinzel Decorative', cursive, serif; text-shadow: 0 0 8px #ffd700;">🧹Wizardry Web</div>

        <ul class="nav-links">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('houses') }}">Houses</a></li>
            <li><a href="{{ url_for('spells') }}">Spells</a></li>
            <li><a href="{{ url_for('owl_post') }}">Owl Post</a></li>
            <li><a href="{{ url_for('owl_archive') }}">Owl Archive</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2><i class="fa-solid fa-dove"></i> SEND AN OWL POST</h2>

        <form method="POST" onsubmit="playMagicSound(event)">
            <div class="form-group">
                <label>Your Witch/Wizard Name:</label>
                <input type="text" name="wizard_name" placeholder="e.g., Hermione Granger" required>
            </div>

            <div class="form-group">
                <label>Select Your House:</label>
                <select name="house" class="house-select">
                    <option value="Gryffindor">Gryffindor 🦁</option>
                    <option value="Slytherin">Slytherin 🐍</option>
                    <option value="Ravenclaw">Ravenclaw 🦅</option>
                    <option value="Hufflepuff">Hufflepuff 🦡</option>
                </select>
            </div>

            <div class="form-group">
                <label>Receiver:</label>
                <input type="text" name="receiver" placeholder="e.g., Albus Dumbledore" required>
            </div>

            <div class="form-group">
                <label>Message for the Owl:</label>
                <textarea name="message" rows="4" placeholder="Write your message across the magical realm..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">DISPATCH OWL <i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <!-- Local Owl Sound Effect -->
    <audio id="magicSound" src="{{ url_for('static', filename='music/owl_hoot.mp3') }}"></audio>

    <script>
        function playMagicSound(event) {
            event.preventDefault();
            const bgMusic = document.getElementById('bgMusic');
            const owlSound = document.getElementById("magicSound");

            // Temporarily mute background music when owl is dispatched to avoid audio clash
            if (bgMusic) {
                bgMusic.muted = true;
            }

            // Set owl sound volume to maximum
            owlSound.volume = 1.0;

            owlSound.play().then(() => {
                setTimeout(() => {
                    event.target.submit();
                }, 1000); // Submit form after 1 second of owl hooting
            }).catch(e => {
                event.target.submit();
            });
        }
    </script>

<!-- Background Magical Theme Music -->
<audio id="bgMusic" src="{{ url_for('static', filename='music/harry_potter.mp3') }}" loop autoplay></audio>

<!-- Floating Corner Music Toggle Button -->
<button id="musicToggleBtn" onclick="toggleBackgroundMusic()" title="Toggle Background Music" style="position: fixed; bottom: 20px; right: 20px; z-index: 10000; background: rgba(0,0,0,0.8); border: 2px solid #ffd700; color: #ffd700; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 1.1rem; box-shadow: 0 0 10px rgba(255,215,0,0.5); transition: 0.3s;">
    <i id="musicIcon" class="fa-solid fa-volume-high"></i>
</button>

<script>
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.25;

    // Browser autoplay policy bypass
    document.addEventListener('click', () => {
        if (bgMusic.paused) {
            bgMusic.play().catch(e => console.log("Autoplay blocked"));
        }
    }, { once: true });

    function toggleBackgroundMusic() {
        const musicIcon = document.getElementById('musicIcon');
        if (bgMusic.paused) {
            bgMusic.play();
            musicIcon.className = "fa-solid fa-volume-high";
        } else {
            bgMusic.pause();
            musicIcon.className = "fa-solid fa-volume-xmark";
        }
    }
</script>
</body>
</html>
