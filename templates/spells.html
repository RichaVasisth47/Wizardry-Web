<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spells - Wizardry Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">⚡ WIZARDRY WEB</div>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('houses') }}">Houses</a>
            <a href="{{ url_for('spells') }}" class="active">Spells</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1 class="page-title">Magical Spells & Incantations</h1>

        <div class="cards-grid">
            {% for spell in spells %}
            <div class="magical-card">
                <h3>{{ spell.name }}</h3>
                <p><strong>Description:</strong> {{ spell.description }}</p>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
